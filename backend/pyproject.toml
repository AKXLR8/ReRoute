[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reroute"
version = "0.1.0"
description = "Enterprise Multi-Provider LLM Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0",
    "prometheus-client>=0.21.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

# Vercel builds run on Linux: resolve torch from the CPU wheel index there so
# the function bundle stays under the 500 MB limit (PyPI linux wheels pull
# multi-GB CUDA libs). pip/Docker ignore these tables — Docker pre-installs
# CPU torch itself.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# Vercel build command: bake the embedding model into the function bundle so
# cold starts never download it.
[tool.vercel.scripts]
build = "python scripts/prefetch_model.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "locust>=2.32.0",
    "fakeredis[lua]>=2.25.0",
]

[tool.setuptools.packages.find]
include = ["reroute*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
# B008: Depends() in defaults is the standard FastAPI pattern
# N818: PolicyDenied/RateLimitExceeded/etc. are the idiomatic names here
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
